name: Test CI

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: 'Environment'
        options:
          - dev-bpmfin
          - sandbox-bpmfin
          - stage-bpmfin-a
          - stage-bpmfin-b
          - prod-bpmfin-a
          - prod-bpmfin-b
        default: dev-bpmfin
      tenantId:
        type: choice
        description: 'Tenant ID'
        options:
          - ganb
          - stc
          - jpbank
          - general
        required: true

jobs:
  tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Run a one-line script
        run: echo Hello, world!
